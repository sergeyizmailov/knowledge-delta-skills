[project]
name = "ttops"
version = "1.0.0"
description = "Deterministic TikTok Marketing API launch/operate CLI for agents"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ttops = "ttops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
ttops = ["currencies.json"]
