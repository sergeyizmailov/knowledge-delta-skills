[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-agent-ops"
version = "0.1.0"
description = "Agent-facing Meta Ads plan/apply/verify lifecycle"
requires-python = ">=3.11"
dependencies = [
  "requests[socks]>=2.32",
  "Pillow>=10",
  "google-auth>=2.30"
]

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "ruff>=0.12"
]

[project.scripts]
metaops = "metaops:main"
sheetfeed = "sheetfeed:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "activate", "asset_graph", "bulk", "clone", "cmd_business", "cmd_catalog", "cmd_edit", "cmd_operate", "swapgate",
  "comments", "edit", "edit_tags", "edit_targeting", "feed_upload", "graph",
  "insights", "launch", "mcp", "media", "meta_workspace", "metaops", "monitor",
  "mutate_set", "page", "probe", "rules", "sheetfeed", "uniquify", "verify"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
