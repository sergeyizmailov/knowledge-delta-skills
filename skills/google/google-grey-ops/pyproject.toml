[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "google-agent-ops"
version = "0.1.0"
description = "Agent-facing Google Ads plan/apply/verify/activate lifecycle plus Merchant Center doctor"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-ads>=31.4,<32",
  "google-shopping-merchant-accounts>=1.6",
  "google-shopping-merchant-products>=1.8",
  "google-shopping-merchant-datasources>=1.5",
  "google-shopping-merchant-reports>=1.5",
  "google-shopping-merchant-issueresolution>=1.4",
  "requests>=2.32",
  "google-auth>=2.30",
]

[dependency-groups]
dev = ["jsonschema>=4.23", "ruff>=0.12"]

[project.scripts]
googleops = "googleops:main"
gmcops = "gmcops:main"
sheetfeed = "sheetfeed:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["googleops", "gads_workspace", "gads_client", "gads_spec", "gads_build", "gads_verify", "gmcops", "sheetfeed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
